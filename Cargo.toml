[workspace]
resolver = "3"
members = ["crates/api","crates/cli", "crates/server", "crates/telemetry"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/bitshift-systems/casrs"
authors = ["casrs contributors"]

[workspace.dependencies]
casrs-api = { path = "crates/api" }
casrs-telemetry = { path = "crates/telemetry" }

axum = { version = "0.8", features = ["macros"] }
clap = { version = "4.6", features = ["derive", "env"] }
thiserror = "2.0"
tokio = "1.54"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.14"
opentelemetry = { version = "0.33", features = ["metrics", "trace", "logs"] }
opentelemetry_sdk = { version = "0.33", features = [
    "rt-tokio",
    "metrics",
    "trace",
    "logs",
    "experimental_metrics_custom_reader",
] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "grpc-tonic",
    "trace",
    "metrics",
    "logs",
] }
opentelemetry-prometheus = "0.33"
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"
url = "2"
